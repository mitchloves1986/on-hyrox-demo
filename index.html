<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cloud X</title>
  <link rel="stylesheet" href="styles.css?v=2026090415" />
</head>
<body>
  <div class="stage">
    <main class="phone">
      <div class="mp-chrome" aria-hidden="true">
        <span class="mp-back">‹</span>
        <span class="mp-title">Roxscan 福利中心</span>
        <span class="mp-capsule"></span>
      </div>
      <header class="hero">
        <video
          class="hero-media"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          poster="assets/hero.webp?v=2026090408"
        >
          <source src="assets/hero.mp4?v=2026090408" type="video/mp4" />
        </video>
      </header>

      <section class="family">
        <h1 class="sr-only">Cloud X 系列综合训练鞋履家族</h1>
        <img
          class="family-chart"
          src="assets/family-chart.webp?v=2026090414"
          alt="Cloud X 系列综合训练鞋履家族，对比 Cloud X 5、Cloud X Tempo、Cloud X Tempo Pro 的场景、参考运动与科技"
        />
      </section>

      <article class="chapter">
        <h2>Cloud X 5</h2>
        <div class="billboard">
          <img src="assets/x5-scene.webp" alt="Cloud X 5" />
          <button type="button" class="shop-pill" data-product="x5">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>灵活灵动，精简设计不减支撑</p>
          <p>低帮轻量，随身带随时练</p>
          <p>舒适入脚，力量训练更稳</p>
          <p>环保中底，每步为地球减负</p>
        </div>
      </article>

      <article class="chapter">
        <h2>Cloud X Tempo</h2>
        <div class="billboard">
          <img src="assets/tempo-scene.webp" alt="Cloud X Tempo" />
          <button type="button" class="shop-pill" data-product="tempo">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>柔软入脚，穿上就能开练</p>
          <p>透气有型，轻松撑起训练节奏</p>
          <p>平稳缓震，动态训练也稳定在线</p>
          <p>高堆叠缓震，灵活应对多元训练</p>
        </div>
      </article>

      <article class="chapter">
        <h2>Cloud X Tempo Pro</h2>
        <div class="billboard">
          <img src="assets/tempo-pro-scene.webp" alt="Cloud X Tempo Pro" />
          <button type="button" class="shop-pill" data-product="tempoPro">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>与世界纪录保持者 Alexander Roncevic 共同研发</p>
          <p>专为混合体能赛而生</p>
          <p>稳定缓震，爆发式推进</p>
          <p>稳固包裹，竞赛级抓地感</p>
        </div>
      </article>

      <section class="recruit">
        <h2>上场</h2>
        <button type="button" class="entry" data-entry="elite">
          <span>On昂跑精英战队</span>
          <small>代表昂跑完赛</small>
        </button>
      </section>
    </main>
  </div>

  <div class="sheet-mask hidden" id="sheetMask" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
      <p class="sheet-kicker" id="sheetKicker"></p>
      <h3 id="sheetTitle"></h3>
      <div class="sheet-body" id="sheetBody"></div>
      <button type="button" class="buy-btn" id="sheetAction"></button>
    </section>
  </div>

  <script src="app.js?v=2026090415"></script>
</body>
</html>
