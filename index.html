<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cloud X</title>
  <link rel="stylesheet" href="styles.css?v=2026090409" />
</head>
<body>
  <div class="stage">
    <main class="phone">
      <div class="mp-chrome" id="mpChrome">
        <div class="mp-status" aria-hidden="true"><span>9:41</span></div>
        <div class="mp-nav">
          <span class="mp-back" aria-hidden="true">‹</span>
          <span class="mp-title">On</span>
          <span class="mp-capsule" aria-hidden="true"></span>
        </div>
      </div>

      <header class="hero">
        <video
          class="hero-media"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          poster="assets/hero.webp?v=2026090408"
        >
          <source src="assets/hero.mp4?v=2026090408" type="video/mp4" />
        </video>
        <img class="hero-mark" src="assets/on-mark.svg" alt="On" />
      </header>

      <section class="family">
        <h1>Cloud X 系列</h1>
        <p>综合训练鞋履家族</p>
        <div class="family-grid">
          <button type="button" class="family-item" data-product="x5">
            <img src="assets/cloud-x-5.webp" alt="Cloud X 5" />
            <strong>Cloud X 5</strong>
          </button>
          <button type="button" class="family-item" data-product="tempo">
            <img src="assets/cloud-x-tempo.webp" alt="Cloud X Tempo" />
            <strong>Cloud X Tempo</strong>
          </button>
          <button type="button" class="family-item" data-product="tempoPro">
            <img src="assets/cloud-x-tempo-pro.webp" alt="Cloud X Tempo Pro" />
            <strong>Cloud X Tempo Pro</strong>
          </button>
        </div>
      </section>

      <article class="chapter">
        <h2>Cloud X 5</h2>
        <div class="billboard">
          <img src="assets/x5-scene.webp" alt="Cloud X 5" />
          <button type="button" class="shop-pill" data-product="x5">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>灵活灵动，精简设计不减支撑</p>
          <p>低帮轻量，随身带随时练<br />舒适入脚，力量训练更稳</p>
          <p>环保中底，每步为地球减负</p>
        </div>
      </article>

      <article class="chapter">
        <h2>Cloud X Tempo</h2>
        <div class="billboard">
          <img src="assets/tempo-scene.webp" alt="Cloud X Tempo" />
          <button type="button" class="shop-pill" data-product="tempo">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>柔软入脚，穿上就能开练</p>
          <p>透气有型，轻松撑起训练节奏<br />平稳缓震，动态训练也稳定在线</p>
          <p>高堆叠缓震，灵活应对多元训练</p>
        </div>
      </article>

      <article class="chapter">
        <h2>Cloud X Tempo Pro</h2>
        <div class="billboard">
          <img src="assets/tempo-pro-scene.webp" alt="Cloud X Tempo Pro" />
          <button type="button" class="shop-pill" data-product="tempoPro">即刻选购</button>
        </div>
        <div class="chapter-copy">
          <p>为混合体能赛而生</p>
          <p>与 Alexander Roncevic 共创</p>
          <p>全掌碳纤维 Speedboard® · Missiongrip™</p>
        </div>
      </article>

      <section class="recruit">
        <h2>上场</h2>
        <button type="button" class="entry" data-entry="elite">
          <span>On昂跑精英战队</span>
          <small>代表昂跑完赛</small>
        </button>
      </section>
    </main>
  </div>

  <div class="sheet-mask hidden" id="sheetMask" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
      <p class="sheet-kicker" id="sheetKicker"></p>
      <h3 id="sheetTitle"></h3>
      <div class="sheet-body" id="sheetBody"></div>
      <button type="button" class="buy-btn" id="sheetAction"></button>
    </section>
  </div>

  <script src="app.js?v=2026090409"></script>
</body>
</html>
