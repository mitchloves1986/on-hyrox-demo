<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Cloud X</title>
  <link rel="stylesheet" href="styles.css?v=2026090405" />
</head>
<body>
  <div class="stage">
    <main class="phone">
      <div class="mp-chrome" id="mpChrome">
        <div class="mp-status" aria-hidden="true"><span>9:41</span></div>
        <div class="mp-nav">
          <span class="mp-back" aria-hidden="true">‹</span>
          <span class="mp-title">On</span>
          <span class="mp-capsule" aria-hidden="true"></span>
        </div>
      </div>

      <header class="hero">
        <img class="hero-photo" src="assets/hero.webp" alt="" />
        <div class="hero-shade"></div>
      </header>

      <section class="family">
        <h1>Cloud X 系列<br />综合训练鞋履家族</h1>
        <div class="family-grid">
          <button type="button" class="family-item" data-product="x5">
            <img src="assets/cloud-x-5.webp" alt="Cloud X 5" />
            <strong>Cloud X 5</strong>
            <span>日常综合训练</span>
          </button>
          <button type="button" class="family-item" data-product="tempo">
            <img src="assets/cloud-x-tempo.webp" alt="Cloud X Tempo" />
            <strong>Cloud X Tempo</strong>
            <span>专项进阶综训</span>
          </button>
          <button type="button" class="family-item" data-product="tempoPro">
            <img src="assets/cloud-x-tempo-pro.webp" alt="Cloud X Tempo Pro" />
            <strong>Cloud X Tempo Pro</strong>
            <span>混合体能赛</span>
          </button>
        </div>
      </section>

      <article class="chapter">
        <img class="chapter-photo" src="assets/cloud-x-5.webp" alt="Cloud X 5" />
        <div class="chapter-copy">
          <h2>Cloud X 5</h2>
          <p>灵活轻量，稳着力量训练。</p>
          <ul>
            <li>日常综合训练</li>
            <li>Helion™ 泡棉 · 低帮轻量</li>
          </ul>
          <button type="button" class="buy-btn" data-product="x5">即刻选购</button>
        </div>
      </article>

      <article class="chapter">
        <img class="chapter-photo" src="assets/cloud-x-tempo.webp" alt="Cloud X Tempo" />
        <div class="chapter-copy">
          <h2>Cloud X Tempo</h2>
          <p>进阶综训，跟上课上的节奏。</p>
          <ul>
            <li>高强度有氧 / 室内跑</li>
            <li>双密度 Helion™ · 高堆叠</li>
          </ul>
          <button type="button" class="buy-btn" data-product="tempo">即刻选购</button>
        </div>
      </article>

      <article class="chapter chapter--dark">
        <img class="chapter-hero" src="assets/hero.webp" alt="Cloud X Tempo Pro" />
        <div class="chapter-copy">
          <h2>Cloud X Tempo Pro</h2>
          <p>为混合体能赛而生。</p>
          <ul>
            <li>与 Alexander Roncevic 共创</li>
            <li>全掌碳纤维 · Missiongrip™</li>
          </ul>
          <button type="button" class="buy-btn buy-btn--light" data-product="tempoPro">即刻选购</button>
        </div>
      </article>

      <section class="recruit">
        <p class="recruit-kicker">上场</p>
        <h2>两种方式。</h2>
        <button type="button" class="entry" data-entry="officer">
          <span>产品体验官</span>
          <small>试穿 Cloud X，带回真实脚感</small>
        </button>
        <button type="button" class="entry" data-entry="elite">
          <span>精英战队</span>
          <small>代表昂跑完赛</small>
        </button>
      </section>
    </main>
  </div>

  <div class="sheet-mask hidden" id="sheetMask" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
      <p class="sheet-kicker" id="sheetKicker"></p>
      <h3 id="sheetTitle"></h3>
      <div class="sheet-body" id="sheetBody"></div>
      <button type="button" class="buy-btn" id="sheetAction"></button>
    </section>
  </div>

  <script src="app.js?v=2026090405"></script>
</body>
</html>
